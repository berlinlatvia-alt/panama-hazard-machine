name: hazard-machine-24x7
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: scratch
          key: hazard-state-${{ github.run_id }}
          restore-keys: |
            hazard-state-
      - name: One hazard cycle (Telegram alerts fire from here)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hazard_machine.py --once
      - name: Persist dedup state via cache
        if: always()
        uses: actions/cache@v4
        with:
          path: scratch
          key: hazard-state-${{ github.run_id }}
